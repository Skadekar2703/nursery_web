      <path d="M220 227 L280 227 L280 365 L220 365 Z" fill="#E5EFE3" opacity="0.9" />
      <circle cx="250" cy="295" r="16" fill="#185C3A" />
      <path d="M250 305 C250 295 242 288 238 285 C248 285 256 290 250 305" fill="#FAF8F0" />
    
  </g>
</svg>