<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F0" />
      <stop offset="100%" stop-color="#EFF4EC" />
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#103D29" flood-opacity="0.1" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="28" fill="url(#bgGrad)" />
  <circle cx="250" cy="230" r="160" fill="#E5EFE3" opacity="0.45" />
  
  <!-- Foliage Layer -->
  <g id="foliage">
    
      <!-- Center tall blade -->
      <path d="M250 320 C240 220 235 140 250 60 C265 140 260 220 250 320" fill="#185C3A" stroke="#E2B842" stroke-width="5" />
      <path d="M250 320 L250 70" stroke="#3E9B57" stroke-width="3" />
      <!-- Left blade -->
      <path d="M250 320 C220 240 195 170 210 100 C235 160 245 230 250 320" fill="#103D29" stroke="#E2B842" stroke-width="4.5" />
      <!-- Right blade -->
      <path d="M250 320 C280 240 305 180 290 110 C265 170 255 240 250 320" fill="#25834A" stroke="#E2B842" stroke-width="4.5" />
      <!-- Short blades -->
      <path d="M250 320 C210 270 180 220 190 170 C210 220 230 270 250 320" fill="#185C3A" stroke="#E2B842" stroke-width="3" />
      <path d="M250 320 C290 270 320 230 310 175 C290 220 270 270 250 320" fill="#3E9B57" stroke="#E2B842" stroke-width="3" />
    
  </g>
  
  <!-- Pot / Container Layer -->
  <g id="pot" filter="url(#pShadow)">
    
  <path d="M180 320 L195 425 Q250 435 305 425 L320 320 Z" fill="#FFFFFF" />
  <ellipse cx="250" cy="320" rx="70" ry="14" fill="#FAF8F0" />
  <ellipse cx="250" cy="320" rx="63" ry="10" fill="#3D291A" />
  <path d="M190 355 Q250 365 310 355" stroke="#E5EFE3" stroke-width="2.5" />

  </g>
</svg>