<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F0" />
      <stop offset="100%" stop-color="#EFF4EC" />
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#103D29" flood-opacity="0.1" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="28" fill="url(#bgGrad)" />
  <circle cx="250" cy="230" r="160" fill="#E5EFE3" opacity="0.45" />
  
  <!-- Foliage Layer -->
  <g id="foliage">
    
      <!-- Cascading variegated arching blades -->
      <path d="M250 320 Q180 260 120 320" stroke="#25834A" stroke-width="6" fill="none" />
      <path d="M250 320 Q180 260 120 320" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <path d="M250 320 Q320 260 380 320" stroke="#25834A" stroke-width="6" fill="none" />
      <path d="M250 320 Q320 260 380 320" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <path d="M250 320 Q200 200 170 140" stroke="#25834A" stroke-width="6" fill="none" />
      <path d="M250 320 Q200 200 170 140" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <path d="M250 320 Q300 200 330 140" stroke="#25834A" stroke-width="6" fill="none" />
      <path d="M250 320 Q300 200 330 140" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <path d="M250 320 Q250 180 250 100" stroke="#25834A" stroke-width="6" fill="none" />
      <path d="M250 320 Q250 180 250 100" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <!-- Baby spiderette offshoot -->
      <path d="M250 320 Q120 300 90 380" stroke="#3E9B57" stroke-width="2" fill="none" />
      <circle cx="90" cy="380" r="12" fill="#25834A" />
      <circle cx="90" cy="380" r="5" fill="#FAF8F0" />
    
  </g>
  
  <!-- Pot / Container Layer -->
  <g id="pot" filter="url(#pShadow)">
    
  <path d="M160 320 C170 410 330 410 340 320 Z" fill="#FFFFFF" />
  <ellipse cx="250" cy="320" rx="90" ry="20" fill="#FAF8F0" />
  <ellipse cx="250" cy="320" rx="80" ry="15" fill="#4B3A2F" />
  <ellipse cx="195" cy="322" rx="10" ry="5" fill="#E8ECE9" />
  <ellipse cx="305" cy="323" rx="12" ry="6" fill="#E8ECE9" />

  </g>
</svg>